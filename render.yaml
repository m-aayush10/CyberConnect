services:
  - type: web
    name: cyberconnect
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MYSQL_HOST
        value: your_mysql_host (use a cloud database like ClearDB or Aiven)
      - key: MYSQL_USER
        value: your_db_user
      - key: MYSQL_PASSWORD
        value: your_db_password
      - key: MYSQL_DB
        value: your_db_name
