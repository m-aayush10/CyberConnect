cat > templates/dashboard.html << 'EOF'
{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="glass-card rounded-2xl p-8">
    <h1 class="text-3xl font-bold mb-6 cyber-text">Welcome, {{ session.user_name }}! 👋</h1>
    <div class="grid md:grid-cols-3 gap-6">
        <div class="glass-card rounded-xl p-6 text-center border border-cyan-500/30 hover:border-cyan-500 transition">
            <div class="text-4xl mb-2">🔗</div>
            <div class="text-2xl font-bold text-cyan-400">0</div>
            <div class="text-gray-400">Connections</div>
        </div>
        <div class="glass-card rounded-xl p-6 text-center border border-green-500/30 hover:border-green-500 transition">
            <div class="text-4xl mb-2">📝</div>
            <div class="text-2xl font-bold text-green-400">0</div>
            <div class="text-gray-400">Posts</div>
        </div>
        <div class="glass-card rounded-xl p-6 text-center border border-yellow-500/30 hover:border-yellow-500 transition">
            <div class="text-4xl mb-2">🏅</div>
            <div class="text-2xl font-bold text-yellow-400">{{ user_skill_count|default(0) }}</div>
            <div class="text-gray-400">Skills</div>
        </div>
    </div>
</div>
{% endblock %}
EOF
