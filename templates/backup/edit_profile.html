{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="glass-card rounded-2xl p-6">
        <h2 class="text-2xl font-bold mb-6 cyber-text">Edit Profile</h2>
        
        <!-- Profile Picture Section -->
        <div class="mb-6 text-center">
            <label class="block text-cyan-400 font-bold mb-2">Profile Picture</label>
            <div class="mb-3">
                {% if user.profile_image %}
                <img src="{{ user.profile_image }}" class="w-32 h-32 rounded-full object-cover mx-auto border-2 border-cyan-500">
                {% else %}
                <div class="w-32 h-32 bg-gradient-to-br from-blue-500 to-blue-700 rounded-full flex items-center justify-center text-4xl text-white mx-auto">
                    {{ user.name[0]|upper if user.name else 'U' }}
                </div>
                {% endif %}
            </div>
            <form method="POST" action="{{ url_for('profile.upload_picture') }}" enctype="multipart/form-data">
                <input type="file" name="profile_pic" accept="image/*" required class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-white w-full">
                <button type="submit" class="btn-cyber mt-2 px-4 py-1 rounded text-sm">Upload Picture</button>
            </form>
        </div>
        
        <hr class="border-gray-700 my-4">
        
        <!-- Bio Edit Form -->
        <form method="POST">
            <div class="mb-4">
                <label class="block text-cyan-400 font-bold mb-2">Bio</label>
                <textarea name="bio" rows="4" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 text-white">{{ user.bio or '' }}</textarea>
            </div>
            <div class="flex gap-3">
                <button type="submit" class="btn-cyber px-6 py-2 rounded">Save Bio</button>
                <a href="{{ url_for('profile.view_profile', user_id=session.user_id) }}" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-2 rounded transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
