{% extends "base.html" %}
{% block title %}Edit Comment{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto">
    <div class="glass-card rounded-2xl p-6">
        <h2 class="text-2xl font-bold mb-6 cyber-text">✏️ Edit Comment</h2>
        
        <form method="POST">
            <div class="mb-4">
                <label class="block text-cyan-400 font-bold mb-2">Comment</label>
                <textarea name="content" rows="4" class="w-full p-3 rounded-lg bg-gray-800/50 border border-gray-700 text-white" required>{{ comment.content }}</textarea>
            </div>
            <div class="flex gap-3">
                <button type="submit" class="btn-cyber px-6 py-2 rounded">Save Changes</button>
                <a href="{{ url_for('posts.feed') }}" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-2 rounded transition">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
