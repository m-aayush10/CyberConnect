{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}

<style>
    .auth-wrap {
        min-height: calc(100vh - 64px);
        display: flex; align-items: center; justify-content: center;
        padding: 40px 16px;
    }
    .auth-card {
        width: 100%; max-width: 420px;
        background: rgba(8,18,40,0.9);
        border: 1px solid rgba(0,80,255,0.15);
        border-radius: 24px; padding: 40px;
        backdrop-filter: blur(20px);
        box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }
    .auth-logo { text-align: center; margin-bottom: 32px; }
    .auth-logo-icon {
        width: 56px; height: 56px; border-radius: 16px;
        background: linear-gradient(135deg, #1d4ed8, #3b82f6);
        display: flex; align-items: center; justify-content: center;
        font-size: 26px; margin: 0 auto 14px;
        box-shadow: 0 8px 24px rgba(59,130,246,0.3);
    }
    .auth-title { font-size: 22px; font-weight: 800; color: #f0f6ff; letter-spacing: -0.02em; }
    .auth-subtitle { font-size: 13px; color: #475569; margin-top: 4px; }
    .auth-field { margin-bottom: 16px; }
    .auth-label {
        display: block; font-size: 12px; font-weight: 600;
        color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;
    }
    .auth-input {
        width: 100%; padding: 12px 16px;
        background: rgba(15,30,70,0.6);
        border: 1px solid rgba(0,80,255,0.15);
        border-radius: 12px; color: #e2e8f0; font-size: 14px;
        outline: none; transition: all 0.2s;
    }
    .auth-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        background: rgba(15,30,80,0.8);
    }
    .auth-input::placeholder { color: #1e3a5f; }
    .auth-btn {
        width: 100%; padding: 13px;
        background: linear-gradient(135deg, #1d4ed8, #3b82f6);
        color: white; border: none; border-radius: 12px;
        font-size: 14px; font-weight: 700; cursor: pointer;
        transition: all 0.2s; margin-top: 4px;
    }
    .auth-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(59,130,246,0.35); }
    .auth-footer { text-align: center; margin-top: 24px; font-size: 13px; color: #475569; }
    .auth-footer a { color: #60a5fa; text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { color: #93c5fd; }
    .perks { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .perk {
        display: flex; align-items: center; gap: 10px;
        font-size: 12px; color: #475569;
    }
    .perk-dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #3b82f6; flex-shrink: 0;
    }
</style>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-icon">🔐</div>
            <div class="auth-title">Join CyberConnect</div>
            <div class="auth-subtitle">Your cybersecurity network starts here</div>
        </div>

        <div class="perks">
            <div class="perk"><div class="perk-dot"></div>Connect with cybersecurity peers</div>
            <div class="perk"><div class="perk-dot"></div>Showcase skills &amp; certifications</div>
            <div class="perk"><div class="perk-dot"></div>Share threat intel &amp; CTF write-ups</div>
        </div>

        <form method="POST">
            <div class="auth-field">
                <label class="auth-label">Full Name</label>
                <input type="text" name="name" class="auth-input" placeholder="John Doe" required>
            </div>
            <div class="auth-field">
                <label class="auth-label">Email address</label>
                <input type="email" name="email" class="auth-input" placeholder="you@example.com" required>
            </div>
            <div class="auth-field">
                <label class="auth-label">Password</label>
                <input type="password" name="password" class="auth-input" placeholder="Create a strong password" required>
            </div>
            <button type="submit" class="auth-btn">Create Account →</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
        </div>
    </div>
</div>

{% endblock %}
